name: Test gcloud login - invalid base64 key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run gcloud login action with invalid base64 (expect failure)
        id: action
        uses: .
        with:
          account_key: "not-valid-base64!!!"
        continue-on-error: true

      - name: Assert action failed with invalid base64 key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # An invalid base64 string should cause the action to fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid base64 account key"
