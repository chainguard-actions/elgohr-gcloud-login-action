name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake base64-encoded JSON key
        id: make-key
        run: |
          # Create a minimal fake service account JSON (invalid for real GCP auth)
          FAKE_JSON='{"type":"service_account","project_id":"test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPpF9y9KKZP0Ej5AAAA\n-----END RSA PRIVATE KEY-----\n","client_email":"test@test-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          ENCODED=$(echo "$FAKE_JSON" | base64 -w 0)
          echo "key=$ENCODED" >> $GITHUB_OUTPUT

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        with:
          account_key: ${{ steps.make-key.outputs.key }}
        continue-on-error: true

      - name: Assert action failed with invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid GCP credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
