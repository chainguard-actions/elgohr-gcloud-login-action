name: Test missing required input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without required account_key input (expect failure)
        id: action
        uses: .
        with:
          account_key: ""
        continue-on-error: true
      - name: Assert action failed when account_key is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when account_key is empty, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when account_key is empty"
