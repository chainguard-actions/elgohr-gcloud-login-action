name: Test malformed account key handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action fails with malformed (non-base64) key
        id: action
        uses: .
        with:
          # A clearly invalid non-base64 string
          account_key: "this-is-not-valid-base64!!!"
        continue-on-error: true
      - name: Assert action failed with malformed key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with a malformed key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with malformed key"
