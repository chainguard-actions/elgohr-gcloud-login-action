name: Test missing account key causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty key and expect failure
        id: action
        uses: .
        with:
          # Provide an empty/whitespace-only base64 value which will decode to nothing
          # and cause gcloud auth to fail
          account_key: ""
        continue-on-error: true
      - name: Assert action failed with empty key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty account_key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with empty account_key"
